[package]
name = "lamsex"
version = "0.1.0"
description = "LamsEX - Minecraft model viewer"
edition = "2021"

[lib]
name = "lamsex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
